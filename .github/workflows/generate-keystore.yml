name: Generate Upload Keystore

# Run this ONCE to create your Play Store upload key. You have no local Java, so
# the key is generated in the cloud here.
#   Actions tab -> "Generate Upload Keystore" -> Run workflow -> fill the fields.
# When it finishes, download the artifact and add the four values to repo Secrets
# (Settings -> Secrets and variables -> Actions). See RELEASING.md.

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: "Key alias"
        required: true
        default: "dupix-upload"
      store_password:
        description: "Keystore password (WRITE THIS DOWN — it cannot be recovered)"
        required: true
      key_password:
        description: "Key password (can match the keystore password)"
        required: true
      dname:
        description: "Certificate identity"
        required: true
        default: "CN=Dupix, OU=BIT, O=BIT, L=City, ST=State, C=US"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate keystore
        env:
          STOREPASS: ${{ github.event.inputs.store_password }}
          KEYPASS: ${{ github.event.inputs.key_password }}
          ALIAS: ${{ github.event.inputs.key_alias }}
          DNAME: ${{ github.event.inputs.dname }}
        run: |
          echo "::add-mask::$STOREPASS"
          echo "::add-mask::$KEYPASS"
          keytool -genkeypair -v \
            -keystore upload.jks \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STOREPASS" -keypass "$KEYPASS" \
            -dname "$DNAME"
          base64 -w0 upload.jks > upload.jks.base64
          echo "Keystore created. Add upload.jks.base64 contents as the KEYSTORE_BASE64 secret."

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: dupix-upload-keystore
          path: |
            upload.jks
            upload.jks.base64
          retention-days: 1
