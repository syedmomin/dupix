name: Release

# Trigger by pushing a version tag, e.g.  git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  release:
    name: Build & publish release APK + AAB
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          validate-wrappers: false

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # Decode the signing keystore from a base64 secret, if configured. Without these
      # secrets the release is built unsigned (fine for testing, NOT for Play upload).
      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dupix.keystore"
            echo "path=$RUNNER_TEMP/dupix.keystore" >> "$GITHUB_OUTPUT"
            echo "Keystore decoded; release will be signed."
          else
            echo "No KEYSTORE_BASE64 secret set; building an UNSIGNED release."
          fi

      - name: Build release AAB and APK
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs='-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8'
            -Dkotlin.daemon.jvmargs='-Xmx3g'
        run: |
          set -o pipefail
          ./gradlew :app:bundleRelease :app:assembleRelease \
            --no-daemon --stacktrace --console=plain --max-workers=2 2>&1 | tee release-build.log

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/bundle/release/*.aab dist/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk dist/ 2>/dev/null || true
          ls -la dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dupix-release
          path: dist/*
          if-no-files-found: warn

      - name: Upload release build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-log
          path: release-build.log
          if-no-files-found: warn

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
