name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Test & build debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          validate-wrappers: false

      # Use the `gradle` binary provided by setup-gradle (not ./gradlew). The build is
      # split into granular steps so that if one fails, the failing task is obvious from
      # the step name alone. Memory settings come from gradle.properties.
      - name: Gradle version
        run: gradle --version --no-daemon

      - name: Compile debug (Kotlin + KSP)
        run: |
          set -o pipefail
          gradle :app:compileDebugKotlin --no-daemon --stacktrace --console=plain 2>&1 | tee build.log

      - name: Unit tests
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --no-daemon --stacktrace --console=plain 2>&1 | tee -a build.log

      - name: Assemble debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee -a build.log

      # If anything above failed, publish the captured log to a diagnostics branch so it
      # can be read via the public raw URL (Actions logs/artifacts need auth to download).
      - name: Publish build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -E "^(e: |w: |> Task|FAILURE|Caused by|.*error:|.*: error)" build.log > errors.txt || true
          git config user.email "ci@local"
          git config user.name "ci"
          git checkout --orphan ci-diagnostics
          git reset
          cp build.log /tmp/build.log; cp errors.txt /tmp/errors.txt
          rm -rf ./* 2>/dev/null || true
          mkdir -p ci-out
          cp /tmp/build.log ci-out/build.log
          cp /tmp/errors.txt ci-out/errors.txt
          git add ci-out/build.log ci-out/errors.txt
          git commit -m "CI diagnostics for ${GITHUB_SHA}"
          git push -f origin ci-diagnostics

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dupix-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload full build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
