name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Test & build debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          validate-wrappers: false

      # Use the `gradle` binary provided by setup-gradle (not ./gradlew). The build is
      # split into granular steps so that if one fails, the failing task is obvious from
      # the step name alone. Memory settings come from gradle.properties.
      - name: Gradle version
        run: gradle --version --no-daemon

      - name: Compile debug (Kotlin + KSP)
        run: gradle :app:compileDebugKotlin --no-daemon --stacktrace --console=plain

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace --console=plain

      - name: Assemble debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee build.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dupix-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload full build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
