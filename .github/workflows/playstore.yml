name: Play Store AAB

# Manual, on-demand release to Google Play.
#   1. Builds the signed Android App Bundle (.aab) that Play Console requires.
#   2. Uploads it to the chosen Play track — but ONLY if the service-account
#      secret is configured. Without it the job still produces a downloadable
#      .aab artifact you can upload to Play Console by hand.
#
# Trigger: Actions tab -> "Play Store AAB" -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track to publish to'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      status:
        description: 'Release status on the track'
        required: true
        default: 'draft'
        type: choice
        options:
          - draft        # staged, you press "publish" in Play Console
          - completed    # rolled out immediately (100%)

permissions:
  contents: read

jobs:
  aab:
    name: Build signed AAB & (optionally) upload to Play
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          validate-wrappers: false

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # Decode the signing keystore from a base64 secret. Play Console rejects an
      # unsigned bundle, so this secret is REQUIRED here (unlike the debug flows).
      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set. A signed AAB is required for Play Store."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dupix.keystore"
          echo "path=$RUNNER_TEMP/dupix.keystore" >> "$GITHUB_OUTPUT"

      # GitHub Actions expressions can't do arithmetic, so compute in bash. The
      # +1000 offset keeps this above the versionCode=1 local default and any
      # earlier manual upload, so Play always treats the bundle as an upgrade.
      - name: Compute version code
        run: echo "VERSION_CODE=$((${{ github.run_number }} + 1000))" >> "$GITHUB_ENV"

      - name: Build release AAB
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs='-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8'
            -Dkotlin.daemon.jvmargs='-Xmx3g'
        run: |
          set -o pipefail
          ./gradlew :app:bundleRelease \
            --no-daemon --stacktrace --console=plain --max-workers=2 2>&1 | tee aab-build.log

      - name: Locate AAB
        id: aab
        run: |
          AAB=$(find app/build/outputs/bundle/release -name '*.aab' | head -n1)
          if [ -z "$AAB" ]; then
            echo "::error::No .aab produced."
            exit 1
          fi
          echo "path=$AAB" >> "$GITHUB_OUTPUT"
          ls -la "$AAB"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: dupix-release-aab
          path: ${{ steps.aab.outputs.path }}
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aab-build-log
          path: aab-build.log
          if-no-files-found: warn

      # Optional: push the bundle to Google Play. Runs only when the
      # PLAY_SERVICE_ACCOUNT_JSON secret exists; otherwise download the artifact
      # above and upload it manually in Play Console.
      - name: Check for Play credentials
        id: play
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$SA" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON not set — skipping auto-upload. Download the dupix-release-aab artifact and upload it in Play Console."
          fi

      - name: Write service account file
        if: steps.play.outputs.enabled == 'true'
        run: |
          cat > "$RUNNER_TEMP/play-sa.json" <<'EOF'
          ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          EOF

      - name: Upload to Google Play
        if: steps.play.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ runner.temp }}/play-sa.json
          packageName: dev.bit.dupix
          releaseFiles: ${{ steps.aab.outputs.path }}
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
